<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div><h1>Expense Tracker</h1><p class="sub">Track your income and spending</p></div>
    <button class="theme" id="theme" aria-label="Toggle dark mode"></button>
  </header>

  <section class="cards" aria-live="polite">
    <div class="card balance"><small>Current balance</small><b id="cBalance">₹0</b></div>
    <div class="card income"><small>Total income</small><b id="cIncome">₹0</b></div>
    <div class="card expense"><small>Total expenses</small><b id="cExpense">₹0</b></div>
  </section>

  <div class="layout">
    <section class="panel">
      <h2 id="formTitle">Add transaction</h2>
      <div class="form">
        <div><label for="fType">Type</label>
          <select id="fType"><option value="expense">Expense</option><option value="income">Income</option></select></div>
        <div><label for="fAmount">Amount (₹)</label>
          <input type="number" id="fAmount" min="0" step="0.01" placeholder="0.00" inputmode="decimal"></div>
        <div><label for="fCat">Category</label><select id="fCat"></select></div>
        <div><label for="fDate">Date</label><input type="date" id="fDate"></div>
        <div class="wide"><label for="fDesc">Description</label>
          <input type="text" id="fDesc" maxlength="60" placeholder="e.g. Lunch at canteen"></div>
        <p class="err" id="err"></p>
        <div class="btns wide">
          <button class="primary" id="save">Add transaction</button>
          <button class="ghost" id="cancel" hidden>Cancel edit</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Spending insights</h2>
      <p class="insight" id="insight">Add some expenses to see insights.</p>
      <div id="bars"></div>
    </section>
  </div>

  <section class="panel">
    <div class="head">
      <h2>Transaction history</h2>
      <div class="filters">
        <select id="fTypeFilter" aria-label="Filter by type">
          <option value="all">All types</option><option value="income">Income</option><option value="expense">Expenses</option>
        </select>
        <select id="fCatFilter" aria-label="Filter by category"></select>
        <input type="month" id="fMonth" aria-label="Filter by month">
      </div>
    </div>
    <ul id="list"></ul>
    <p class="foot" id="foot"></p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
