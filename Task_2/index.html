<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div><h1>Task Manager</h1><p class="sub" id="today"></p></div>
    <button class="theme" id="theme" aria-label="Toggle dark mode"></button>
  </header>

  <section class="stats" aria-live="polite">
    <div class="stat"><b id="sTotal">0</b><small>Total</small></div>
    <div class="stat"><b id="sPending">0</b><small>Pending</small></div>
    <div class="stat"><b id="sDone">0</b><small>Completed</small></div>
  </section>

  <section class="panel">
    <div class="form" id="form">
      <div class="title"><label for="fTitle">Task</label><input type="text" id="fTitle" maxlength="100" placeholder="What needs to be done?"></div>
      <div class="f2"><label for="fCat">Category</label>
        <select id="fCat"><option>Personal</option><option>Study</option><option>Work</option><option>Health</option><option>Other</option></select></div>
      <div class="f2"><label for="fPri">Priority</label>
        <select id="fPri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
      <div class="f2"><label for="fDue">Due date</label><input type="date" id="fDue"></div>
      <p class="err" id="err"></p>
      <div class="btns"><button class="primary" id="save">Add task</button><button class="ghost" id="cancel" hidden>Cancel edit</button></div>
    </div>
  </section>

  <section class="tools">
    <input type="search" class="search" id="q" placeholder="Search tasks" aria-label="Search tasks">
    <select id="fStatus" aria-label="Status"><option value="all">All status</option><option value="pending">Pending</option><option value="done">Completed</option></select>
    <select id="fCategory" aria-label="Category filter"><option value="all">All categories</option><option>Personal</option><option>Study</option><option>Work</option><option>Health</option><option>Other</option></select>
    <select id="fPriority" aria-label="Priority filter"><option value="all">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
    <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="due">Due date</option><option value="pri">Priority</option></select>
  </section>

  <ul id="list"></ul>
  <p style="text-align:right"><button class="ghost" id="clear">Clear completed</button></p>
</main>

<script src="script.js"></script>
</body>
</html>
